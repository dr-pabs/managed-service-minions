# Declarative item pipelines (Milestone 16). One entry per Stream item_type:
# a bounded classify -> act -> verify -> commit/escalate sequence, expressed as
# configuration plus prompts. The pipeline engine is generic; this file is the
# recipe. `max_attempts` bounds the act/verify retry loop (unbounded iteration
# belongs to Flow, never here).
item_pipelines:
  refund_request:
    max_attempts: 2
    on_failure: dead_letter
    # Hard per-item cost cap (budget/v1 scope "item", policy "halt"). An item
    # whose model spend reaches this dead-letters as BUDGET_EXCEEDED — the item
    # halts, never the queue. `warn_at_pct` fires the BUDGET_WARNING crossing.
    max_cost_usd: 0.75
    warn_at_pct: 80
    classify:
      agent: refund_classifier
      system_prompt: refund-classify.md
    act:
      agent: refund_processor
      system_prompt: refund-act.md
      output_schema: refund-action-output.json
    verify:
      verifier: composite:refund_request
      schema: true
      reconcile_checks:
        - server_alias: payments
          tool_name: payments_get_charge
          params:
            order_id: "$output.order_id"
          assert:
            read_field: amount_usd
            output_field: amount_usd
      judge:
        agent: refund_judge
        system_prompt: refund-judge.md
        sample_percent: 0
    commit:
      effect_type: payment.refund
      target_system: payments
      reversibility: compensatable
