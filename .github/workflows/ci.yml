name: CI

# Red build policy ("Ralph Wiggum" loop):
# Any failure in this workflow blocks merge. The author must fix the root cause,
# re-run the full pipeline, and obtain maintainer/QA approval. No bypasses.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'extensions/**'
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'rules/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'test/**'
      - 'infra/terraform/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - '.prettierrc'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'extensions/**'
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'rules/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'test/**'
      - 'infra/terraform/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - '.prettierrc'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Validate config (agents/rules/schemas cross-check)
        run: pnpm tsx scripts/validate-config.ts

      # Coverage gate: each package's own `test` script already runs `jest --coverage`, and each
      # package's jest.config.js enforces branches/lines >= 95%, functions/statements = 100%.
      # jest exits non-zero when a package drops below its threshold, which fails this step and
      # the job -- this genuinely gates the build, it is not a cosmetic echo. See ADR-023's
      # 2026-07-09 amendment for why 100% branches/lines was lowered to 95%.
      - name: Unit tests with coverage
        run: pnpm -r --filter "!infra" test

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test

      # If any previous step fails, the workflow stops here and merge is blocked.
      # Uncomment and configure SLACK_WEBHOOK_URL to broadcast failures:
      # - name: Notify team on failure
      #   if: failure()
      #   run: |
      #     curl -X POST -H 'Content-type: application/json' \
      #       --data '{"text":"🚨 Ralph Wiggum says: build is red on ${{ github.ref }} (${{ github.sha }}). Fix, re-run, and get QA approval before merging."}' \
      #       ${{ secrets.SLACK_WEBHOOK_URL }}

  # Remediation Milestone 11: the contract drift suites (identity vectors,
  # verification/effects/escalation fixtures) run against the real
  # forge-contracts repository instead of skipping, and the Azurite-guarded
  # integration tests (durable idempotency/commit records, shared governance
  # state, the two-replica breaker) run against a live emulator.
  contracts-and-azurite:
    name: Contract drift + Azurite integration
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10002:10002
    steps:
      - uses: actions/checkout@v4

      - name: Check out forge-contracts
        uses: actions/checkout@v4
        with:
          repository: dr-pabs/forge-contracts
          path: contracts-checkout

      - uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Contract drift suites (identity, verification, effects, escalation)
        env:
          FORGE_CONTRACTS_DIR: ${{ github.workspace }}/contracts-checkout
        run: |
          pnpm --filter framework-core test -- identity-contract contracts-dir
          pnpm --filter queue-ingress test -- contracts-drift
          pnpm --filter mcp-toolshed test -- contracts-drift

      - name: Azurite integration suites
        env:
          FORGE_CONTRACTS_DIR: ${{ github.workspace }}/contracts-checkout
          AZURITE_TABLES_CONNECTION_STRING: UseDevelopmentStorage=true;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
        run: |
          pnpm --filter queue-ingress test -- azurite
          pnpm --filter mcp-toolshed test -- azurite
