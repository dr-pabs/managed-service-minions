governance:
  # NOTE: this list is intentionally incomplete. The effect gateway's
  # `effect_gateway.commit_effect` is injected as a destructive action at
  # runtime by ensureEffectGatewayRules() (extensions/mcp-toolshed/src/
  # effect-gateway.ts, ADR-028) whenever the gateway is wired into a
  # toolshed, so a commit surfaces a human-visible approval even under an
  # empty or stale copy of this file — the invariant lives in code and is
  # only mirrored here in comment form. Do not add a commit_effect row
  # below; the runtime injection is idempotent and authoritative
  # (discard_effect is deliberately NOT destructive).
  destructive_actions:
    - server_alias: github
      tool_name: github_merge_pull_request
    - server_alias: azure_devops
      tool_name: ado_merge_pull_request
    - server_alias: servicenow
      tool_name: servicenow_update_incident
    - server_alias: jira
      tool_name: jira_update_issue

  approval_timeout_minutes: 15

  # There is deliberately no `effect_gateway` entry here or under
  # cache_policy: the gateway is in-process (no network to throttle, no
  # breaker to trip) and its results must never be cached (a commit is a
  # decision record, not a read). The `default` bucket still applies to its
  # tool calls like any other.
  rate_limits:
    default:
      requests_per_minute: 60
      burst: 20
    github:
      requests_per_minute: 30
      burst: 10
    azure_devops:
      requests_per_minute: 60
      burst: 20
    servicenow:
      requests_per_minute: 60
      burst: 20
    jira:
      requests_per_minute: 60
      burst: 20

  workspace_boundaries:
    allowed_base_paths:
      - /repo
    deny_patterns:
      - .git/
      - node_modules/
      - secrets/**
      - .env*

  # Path scope hardening (H1/M5): tool name -> list of param keys whose value
  # is a filesystem path that isPathAllowed must check. Every listed key
  # present on a call is checked (not just the first one found), so a tool
  # that accepts more than one path-like param (none do yet) can never smuggle
  # an unchecked one through. Replaces the old hardcoded five-tool
  # `serverAliasForTool` list in extensions/mcp-toolshed/src/config.ts.
  # `execute` (the virtual shell.execute tool) is checked on `cwd` so a
  # minion cannot escape its sandbox by spawning a shell rooted elsewhere.
  path_checked_tools:
    read_file:
      - path
    list_directory:
      - directory_path
    search_files:
      - search_path
    write_file:
      - path
    edit_file:
      - path
    execute:
      - cwd

  fallback_behavior:
    on_allowlist_block: escalate_and_terminate
    on_rate_limit: retry_with_backoff
    on_circuit_breaker_open: fast_fail_with_retry_after
    on_approval_timeout: deny
    on_minion_timeout: retry_up_to_3
    on_invalid_json_output: retry_once_with_feedback

  # Caching is opt-in, read-only, and TTL-bound (C3 / F4): only tools listed
  # here with cacheable: true are ever cached, and only idempotent reads
  # qualify. Destructive tools (see destructive_actions above) must never be
  # marked cacheable — scripts/validate-config.ts rejects that combination.
  cache_policy:
    default:
      cacheable: false
    github_get_pull_request_diff:
      cacheable: true
      ttl_seconds: 300
    github_get_pull_request:
      cacheable: true
      ttl_seconds: 300
    github_list_pull_requests:
      cacheable: true
      ttl_seconds: 60
    ado_get_pull_request_diff:
      cacheable: true
      ttl_seconds: 300
    ado_get_pull_request:
      cacheable: true
      ttl_seconds: 300
    ado_list_pull_requests:
      cacheable: true
      ttl_seconds: 60
    ado_list_work_items:
      cacheable: true
      ttl_seconds: 60
    ado_get_work_item:
      cacheable: true
      ttl_seconds: 60
    servicenow_list_incidents:
      cacheable: true
      ttl_seconds: 60
    servicenow_get_incident:
      cacheable: true
      ttl_seconds: 60
    jira_list_issues:
      cacheable: true
      ttl_seconds: 60
    jira_get_issue:
      cacheable: true
      ttl_seconds: 60
